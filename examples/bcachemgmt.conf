# bcachemgmt.conf - desired state and defaults for bcachemgmt
#
# Install this as one of:
#   /etc/${ORGANIZATION}/bcachemgmt.conf   (ORGANIZATION from /etc/org.conf)
#   /etc/orgdefault/bcachemgmt.conf
#   /etc/bcachemgmt.conf
#   ${HOME}/.config/bcachemgmt.conf        (and the same two variants)
#
# The first match per scope wins; the user scope overrides the system scope.
# The file is sourced by the script, so shell comments, line continuations
# and quoting all work as usual.
#
# Check what a change here would do before doing it:
#   bcachemgmt diff
#   bcachemgmt apply --dry-run
#   bcachemgmt apply

# --------------------------------------------------------------------------
# Defaults for the command-line options
# --------------------------------------------------------------------------
# Anything set here is overridden by the matching environment variable and by
# the command line. --yes and --force cannot be set from this file on
# purpose: a configuration file must not be able to disarm the confirmation
# prompts of the destructive commands.

# Warn in "doctor" below this much free cache space, in percent.
MIN_AVAILABLE=15

# How long "flush" and "detach" wait, in seconds. 0 waits indefinitely,
# which is the right choice for a large writeback cache.
TIMEOUT=600

# --------------------------------------------------------------------------
# Desired state
# --------------------------------------------------------------------------
# Three directives, one per kind of object:
#
#   device       NAME attribute=value ...   a backing device
#   cache_set    NAME attribute=value ...   a cache set
#   cache_device NAME attribute=value ...   a cache device
#
# NAME addresses the object. For a backing device any of these work:
#   bcache0                                 the bcache device name
#   sdb1 or /dev/sdb1                       the backing device
#   ata-Samsung_SSD_870_S5Y2NJ0R123456      a /dev/disk/by-id name
#   aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee    the backing device UUID
#   all                                     every backing device
#
# Prefer a by-id name or a UUID over bcache0: the bcache numbering depends on
# the order the devices are registered in and can change across a reboot.
#
# "all" is a default layer. A stanza naming a specific device always wins
# over it, wherever the two appear in the file. Within one layer the last
# assignment wins, so appending a line is the way to correct an earlier one.

# Defaults for every backing device: do not push large sequential streams
# through the SSD, they only evict the random data the cache exists for.
device all \
    sequential_cutoff=4M \
    writeback_percent=10

# The database volume runs writeback and is allowed to keep more dirty data.
device aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee \
    cache_mode=writeback \
    writeback_percent=20 \
    writeback_running=1

# The archive volume only benefits from read caching.
#device backup-disk cache_mode=writearound

# Cache set tuning. The congested thresholds decide when bcache starts
# bypassing the cache because the SSD is busier than the backing disk.
cache_set all \
    congested_read_threshold_us=2000 \
    congested_write_threshold_us=20000

# Cache device tuning.
#cache_device nvme0n1p1 cache_replacement_policy=lru

# --------------------------------------------------------------------------
# Attributes that may be set
# --------------------------------------------------------------------------
# device:
#   cache_mode                     writethrough, writeback, writearound, none
#   writeback_percent              0 to 40
#   writeback_running              0 or 1
#   writeback_delay                seconds
#   writeback_metadata             0 or 1
#   writeback_rate_minimum         sectors per second
#   writeback_rate_update_seconds  seconds
#   writeback_rate_p_term_inverse  integer
#   writeback_rate_i_term_inverse  integer
#   sequential_cutoff              size, for example 4M or 0 to disable
#   readahead                      size
#
# cache_set:
#   congested_read_threshold_us    microseconds, 0 disables
#   congested_write_threshold_us   microseconds, 0 disables
#   errors                         unregister or panic
#   io_error_limit                 integer
#   journal_delay_ms               milliseconds
#   synchronous                    0 or 1
#   gc_after_writeback             0 or 1
#   btree_shrinker_disabled        0 or 1
#   copy_gc_enabled                0 or 1
#
# cache_device:
#   cache_replacement_policy       lru, fifo or random
#   discard                        0 or 1
#   io_error_halflife              integer
#
# An attribute the running kernel does not expose is reported as
# "unsupported" by "diff" rather than silently ignored.
